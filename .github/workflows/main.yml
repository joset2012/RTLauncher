name: 'Tauri App Build'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macos-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'linux-bundle'
          - platform: 'ubuntu-22.04'
            args: '--config src-tauri/tauri.linux.conf.json'
            name: 'linux-portable'
          - platform: 'windows-latest'
            args: ''
            name: 'windows-installer'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install --ignore-workspace

      - uses: tauri-apps/tauri-action@v1
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Sign Windows installer
        if: matrix.platform == 'windows-latest'
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:CERT_BASE64) {
            Write-Host "[WARN] WINDOWS_CERTIFICATE_BASE64 secret not set, skipping signature"
            exit 0
          }
          $certBytes = [Convert]::FromBase64String($env:CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          $setupExe = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          $msiFile = Get-ChildItem -Path "src-tauri\target\release\bundle\msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          $filesToSign = @()
          if ($setupExe) { $filesToSign += $setupExe.FullName }
          if ($msiFile) { $filesToSign += $msiFile.FullName }
          if (-not $filesToSign) {
            Write-Host "[WARN] No NSIS setup.exe or MSI found to sign"
            exit 0
          }
          foreach ($file in $filesToSign) {
            Write-Host "Signing $file"
            $signArgs = @("sign", "/fd", "SHA256", "/f", $certPath)
            if ($env:CERT_PASSWORD) {
              $signArgs += @("/p", $env:CERT_PASSWORD)
            }
            $signArgs += @("/tr", "http://timestamp.digicert.com", "/td", "SHA256", $file)
            & signtool $signArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "[ERROR] Signing failed for $file with exit code $LASTEXITCODE"
              exit 1
            }
          }
          Write-Host "[OK] All Windows installers signed successfully"
          Remove-Item $certPath -ErrorAction SilentlyContinue

      - name: upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-app-${{ matrix.name }}
          path: |
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
          if-no-files-found: warn
          retention-days: 7

      - name: upload artifacts (Ubuntu bundle)
        if: matrix.name == 'linux-bundle'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-app-linux-bundle
          path: |
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: package portable version
        if: matrix.name == 'linux-portable'
        run: |
          tar -czf RTLauncher-portable.tar.gz \
            src-tauri/target/release/rtlauncher \
            src-tauri/install-deps.sh \
            src-tauri/PORTABLE_README.md

      - name: upload artifacts (Ubuntu portable)
        if: matrix.name == 'linux-portable'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-app-linux-portable
          path: RTLauncher-portable.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: tauri-app-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
